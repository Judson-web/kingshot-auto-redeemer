name: Sync existing secrets to Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Bind existing runtime secrets without exposing values
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bind only secrets missing from the current Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b45bd4f50a1e0280366712348fe2055a
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEON_RECOVERY_DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_APPLICATION_PUBLIC_KEY: ${{ secrets.DISCORD_APPLICATION_PUBLIC_KEY }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BRAND_ICON_URL: ${{ secrets.DISCORD_BRAND_ICON_URL }}
          DISCORD_KINGSHOT_WEBHOOK_URL: ${{ secrets.DISCORD_KINGSHOT_WEBHOOK_URL }}
          DISCORD_SCRAPER_WEBHOOK_URL: ${{ secrets.DISCORD_SCRAPER_WEBHOOK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALLIANCE_SYNC_CRON_SECRET: ${{ secrets.ALLIANCE_SYNC_CRON_SECRET }}
          KINGSHOT_API_SECRET: ${{ secrets.KINGSHOT_API_SECRET }}
          KINGSHOT_AGGREGATOR_API_KEY: ${{ secrets.KINGSHOT_AGGREGATOR_API_KEY }}
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
          MIGHTPULSE_API_KEY_2: ${{ secrets.MIGHTPULSE_API_KEY_2 }}
          MIGHTPULSE_API_KEY_3: ${{ secrets.MIGHTPULSE_API_KEY_3 }}
          MIGHTPULSE_API_KEY_4: ${{ secrets.MIGHTPULSE_API_KEY_4 }}
          MIGHTPULSE_API_KEY_5: ${{ secrets.MIGHTPULSE_API_KEY_5 }}
          MIGHTPULSE_API_KEY_6: ${{ secrets.MIGHTPULSE_API_KEY_6 }}
          V4_WEBHOOK_ENCRYPTION_KEY: ${{ secrets.V4_WEBHOOK_ENCRYPTION_KEY }}
          V4_WEBHOOK_WORKER_SECRET: ${{ secrets.V4_WEBHOOK_WORKER_SECRET }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_VAPID_SUBJECT: ${{ secrets.WEB_PUSH_VAPID_SUBJECT }}
          CUSTOM_MESSAGE_DESTINATIONS: ${{ secrets.CUSTOM_MESSAGE_DESTINATIONS }}
          CUSTOM_MESSAGE_WEBHOOK_1494360495694549134_URL: ${{ secrets.CUSTOM_MESSAGE_WEBHOOK_1494360495694549134_URL }}
        run: |
          set +x
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          SETTINGS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kingshot-autoredeemer-edge/settings")"
          printf '%s' "$SETTINGS" | jq -e '.success == true' >/dev/null
          EXISTING="$(printf '%s' "$SETTINGS" | jq -r '.result.bindings[]? | select(.type == "secret_text") | .name')"
          MISSING=()
          BOUND=()
          SKIPPED=()
          NAMES=(
            SUPABASE_SERVICE_ROLE_KEY SUPABASE_SECRET_KEY SUPABASE_PUBLISHABLE_KEY SUPABASE_ANON_KEY
            NEON_RECOVERY_DATABASE_URL DISCORD_BOT_TOKEN DISCORD_PUBLIC_KEY DISCORD_APPLICATION_PUBLIC_KEY
            DISCORD_APPLICATION_ID DISCORD_BRAND_ICON_URL DISCORD_KINGSHOT_WEBHOOK_URL DISCORD_SCRAPER_WEBHOOK_URL
            CRON_SECRET ALLIANCE_SYNC_CRON_SECRET KINGSHOT_API_SECRET KINGSHOT_AGGREGATOR_API_KEY
            MIGHTPULSE_API_KEY MIGHTPULSE_API_KEY_2 MIGHTPULSE_API_KEY_3 MIGHTPULSE_API_KEY_4 MIGHTPULSE_API_KEY_5 MIGHTPULSE_API_KEY_6
            V4_WEBHOOK_ENCRYPTION_KEY V4_WEBHOOK_WORKER_SECRET
            WEB_PUSH_VAPID_PUBLIC_KEY WEB_PUSH_VAPID_PRIVATE_KEY WEB_PUSH_VAPID_SUBJECT
            CUSTOM_MESSAGE_DESTINATIONS CUSTOM_MESSAGE_WEBHOOK_1494360495694549134_URL
          )
          for name in "${NAMES[@]}"; do
            if printf '%s\n' "$EXISTING" | grep -Fxq "$name"; then
              SKIPPED+=("$name")
              continue
            fi
            value="${!name:-}"
            if [ -z "$value" ]; then
              MISSING+=("$name")
              continue
            fi
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --name kingshot-autoredeemer-edge >/dev/null
            BOUND+=("$name")
          done
          {
            echo "## Cloudflare Worker secret sync"
            echo
            echo "Existing secrets preserved: ${#SKIPPED[@]}"
            printf 'Bound from GitHub Actions: %s\n' "${BOUND[*]:-none}"
            echo
            echo "Not present in GitHub Actions and not changed: ${MISSING[*]:-none}"
            echo
            echo "Secret values were never printed. Existing Worker secrets were not overwritten."
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Bound: %s\n' "${BOUND[*]:-none}"
          printf 'Missing (not modified): %s\n' "${MISSING[*]:-none}"
