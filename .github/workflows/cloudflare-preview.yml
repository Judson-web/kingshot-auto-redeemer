name: Cloudflare Worker Preview

on:
  push:
    branches:
      - main
      - migration/cloudflare-worker-preview
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "*.html"
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/cloudflare-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and deploy isolated Cloudflare preview
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run typecheck
          npm test

      - name: Build frontend
        run: npm run build

      - name: Deploy to workers.dev only
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
