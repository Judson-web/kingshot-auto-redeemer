name: Cloudflare Native Runtime Deploy
# Deployment remains workers.dev-only until the migration checks pass.

on:
  push:
    branches:
      - main
      - migration/cloudflare-worker-preview
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "*.html"
      - "cloudflare/**"
      - "workers/**"
      - "api/**"
      - "internal/**"
      - "lib/**"
      - "scripts/cloudflare-worker-smoke.mjs"
      - "scripts/cloudflare-sync-secrets.sh"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/cloudflare-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and deploy Cloudflare workers.dev runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check application source
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Exercise Worker runtime locally before deployment
        run: node scripts/cloudflare-worker-smoke.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b45bd4f50a1e0280366712348fe2055a

      - name: Bootstrap private shard Worker
        run: npx --yes wrangler@4 deploy --config workers/shard/bootstrap.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b45bd4f50a1e0280366712348fe2055a

      - name: Bind only missing runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b45bd4f50a1e0280366712348fe2055a
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEON_RECOVERY_DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_APPLICATION_PUBLIC_KEY: ${{ secrets.DISCORD_APPLICATION_PUBLIC_KEY }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BRAND_ICON_URL: ${{ secrets.DISCORD_BRAND_ICON_URL }}
          DISCORD_KINGSHOT_WEBHOOK_URL: ${{ secrets.DISCORD_KINGSHOT_WEBHOOK_URL }}
          DISCORD_SCRAPER_WEBHOOK_URL: ${{ secrets.DISCORD_SCRAPER_WEBHOOK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALLIANCE_SYNC_CRON_SECRET: ${{ secrets.ALLIANCE_SYNC_CRON_SECRET }}
          KINGSHOT_AGGREGATOR_API_KEY: ${{ secrets.KINGSHOT_AGGREGATOR_API_KEY }}
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
          MIGHTPULSE_API_KEY_2: ${{ secrets.MIGHTPULSE_API_KEY_2 }}
          MIGHTPULSE_API_KEY_3: ${{ secrets.MIGHTPULSE_API_KEY_3 }}
          MIGHTPULSE_API_KEY_4: ${{ secrets.MIGHTPULSE_API_KEY_4 }}
          MIGHTPULSE_API_KEY_5: ${{ secrets.MIGHTPULSE_API_KEY_5 }}
          MIGHTPULSE_API_KEY_6: ${{ secrets.MIGHTPULSE_API_KEY_6 }}
          V4_WEBHOOK_ENCRYPTION_KEY: ${{ secrets.V4_WEBHOOK_ENCRYPTION_KEY }}
          V4_WEBHOOK_WORKER_SECRET: ${{ secrets.V4_WEBHOOK_WORKER_SECRET }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_VAPID_SUBJECT: ${{ secrets.WEB_PUSH_VAPID_SUBJECT }}
          CUSTOM_MESSAGE_DESTINATIONS: ${{ secrets.CUSTOM_MESSAGE_DESTINATIONS }}
          CUSTOM_MESSAGE_WEBHOOK_1494360495694549134_URL: ${{ secrets.CUSTOM_MESSAGE_WEBHOOK_1494360495694549134_URL }}
        run: bash scripts/cloudflare-sync-secrets.sh

      - name: Deploy isolated shard and main workers
        run: |
          npx --yes wrangler@4 deploy --config workers/shard/wrangler.jsonc
          npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b45bd4f50a1e0280366712348fe2055a

      - name: Smoke-test deployed workers.dev runtime
        run: node scripts/cloudflare-worker-smoke.mjs
        env:
          WORKER_PREVIEW_URL: https://app.ks-redeemer.workers.dev
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
