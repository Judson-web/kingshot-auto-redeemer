name: Test Discord operational webhook

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-operational-webhook-test
  cancel-in-progress: false

jobs:
  send-safe-test-event:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send a protected direct test event through the production Cloudflare runtime
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          URL="https://kingshot-autoredeemer-edge.sajijudsa.workers.dev/api/kingshot-auto?mode=discord-webhook-test"
          BODY="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$URL")"
          printf '%s\n' "$BODY" | jq '{ok, mode, delivered}'
          printf '%s' "$BODY" | jq -e '.ok == true and .mode == "discord-webhook-test" and .delivered == true' >/dev/null
