name: Sync Discord Application Commands

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-discord-commands.mjs"
      - ".github/workflows/sync-discord-commands.yml"
  workflow_dispatch:
    inputs:
      guild_id:
        description: "Discord server ID. Defaults to the Kingshot community server."
        required: false
        default: "1494360495694549134"
        type: string

permissions:
  contents: read

concurrency:
  group: discord-command-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Register and verify /player, /alliance, and /register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate required configuration
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::error::Add DISCORD_BOT_TOKEN as a repository Actions secret."
            exit 1
          fi

      - name: Upsert commands and verify Discord read-back
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: "1559989049505226812"
          DISCORD_GUILD_ID: ${{ github.event.inputs.guild_id || '1494360495694549134' }}
        run: node scripts/sync-discord-commands.mjs
