name: Android automatic release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate release signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::Missing ANDROID_SIGNING_KEY_BASE64 repository secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing ANDROID_SIGNING_STORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_SIGNING_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_SIGNING_KEY_PASSWORD repository secret"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle -p android testDebugUnitTest

      - name: Build signed release APK
        id: version
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#android-v}"
          else
            VERSION="$RELEASE_VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid Android version: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          gradle -p android assembleRelease -PappVersion="$VERSION" -PappVersionCode="$GITHUB_RUN_NUMBER"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kingshot Auto Redeemer v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: android/app/build/outputs/apk/release/app-release.apk
