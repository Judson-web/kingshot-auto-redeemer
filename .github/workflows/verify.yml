name: Verify and Production Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ci/verify-tests-typecheck-build", "test/archive-date-filtering"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: verify-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Security regression, tests, typecheck, and build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Security regression checks
        run: node scripts/security-regression.mjs

      - name: Run tests
        run: npm test

      - name: TypeScript and JavaScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

  smoke:
    name: Production smoke test
    if: github.event_name != 'schedule'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for production deployment
        run: sleep 30

      - name: Smoke test production
        run: node scripts/production-smoke.mjs

  watchdog:
    name: Worker watchdog
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check worker health
        run: node scripts/worker-watchdog.mjs
