name: Kingdom Check Migration Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261019100000_kingdom_check_durable_retry.sql"
      - "tests/sql/kingdom-check-fixture.sql"
      - "tests/sql/kingdom-check-assertions.sql"
      - ".github/workflows/kingdom-check-migration-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-integration:
    name: Apply and exercise migration on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:migration-test@localhost:5432/migration_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PostgreSQL client
        run: psql --version

      - name: Prepare minimal pre-migration schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/kingdom-check-fixture.sql

      - name: Apply versioned migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261019100000_kingdom_check_durable_retry.sql

      - name: Exercise claims, retry windows, and least-privilege grants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/kingdom-check-assertions.sql

      - name: Prove two concurrent claims cannot both succeed
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into public.kingshot_autoredeem (player_id, enabled, stale, kingdom_id, last_kingdom_check_at, updated_at) values ('concurrent-claim-player', true, false, '200', clock_timestamp() - interval '2 days', clock_timestamp())"
          psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select case when coalesce((public.claim_kingshot_kingdom_reset_check('concurrent-claim-player')->>'claimed')::boolean, false) then 'true' else 'false' end" > /tmp/kingdom-claim-one.txt &
          first_pid=$!
          psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select coalesce((public.claim_kingshot_kingdom_reset_check('concurrent-claim-player')->>'claimed')::boolean, false)" > /tmp/kingdom-claim-two.txt &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"
          first_result="$(tr -d '[:space:]' < /tmp/kingdom-claim-one.txt)"
          second_result="$(tr -d '[:space:]' < /tmp/kingdom-claim-two.txt)"
          echo "Concurrent claim results: $first_result and $second_result"
          if [[ "$first_result" == "$second_result" ]]; then
            echo "ERROR: exactly one concurrent claim must succeed"
            exit 1
          fi
          if [[ "$first_result" != "true" && "$second_result" != "true" ]]; then
            echo "ERROR: neither concurrent claim succeeded"
            exit 1
          fi
