name: OWASP ZAP Baseline

on:
  # Manual only. Enable after the new production URL is ready and explicitly configured.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Passive scan of production
    if: vars.LEGACY_VERCEL_ZAP_ENABLED == 'true' && vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.PRODUCTION_URL }}
          cmd_options: "-a -m 3"
          fail_action: false
          allow_issue_writing: false
