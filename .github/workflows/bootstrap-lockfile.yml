name: Temporary npm lockfile bootstrap and validation

on:
  push:
    branches:
      - security/host-owner-lockfile-hardening

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: security/host-owner-lockfile-hardening
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Resolve and lock dependencies without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact lockfile tree
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Audit dependencies (report-only)
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const path = process.env.RUNNER_TEMP + "/npm-audit.json";
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const counts = report.metadata?.vulnerabilities || {};
            console.log("npm audit summary:", JSON.stringify(counts));
            for (const [name, finding] of Object.entries(report.vulnerabilities || {})) {
              console.log(name + ": severity=" + finding.severity +
                ", direct=" + Boolean(finding.isDirect) +
                ", fixAvailable=" + JSON.stringify(finding.fixAvailable ?? false));
            }
          '
      - name: Commit generated lockfile if needed
        run: |
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Judson-web@users.noreply.github.com"
          git commit -m "chore: add reproducible npm lockfile"
          git push origin HEAD:security/host-owner-lockfile-hardening
